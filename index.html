<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videy - Upload Video</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --primary-blue: #0066ff;
      --primary-blue-hover: #0052cc;
      --glass-blue: #e8f0ff;
      --text-dark: #1c1c1e;
      --text-muted: #8e8e93;
      --border-color: #e5e5ea;
    }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .app-container { background-color: var(--card-bg); border-radius: 40px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05); width: 100%; max-width: 420px; position: relative; }
    .drop-zone { border: 2px dashed var(--border-color); border-radius: 30px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; background-color: #fafafa; }
    .drop-zone.dragover { background-color: var(--glass-blue); border-color: var(--primary-blue); }
    .upload-icon-wrapper { width: 70px; height: 70px; background: linear-gradient(135deg, #ffffff, #e8f0ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; box-shadow: 0 10px 20px rgba(0, 102, 255, 0.15), inset 0 2px 5px rgba(255,255,255,0.8); }
    .upload-icon-wrapper i { font-size: 24px; color: var(--primary-blue); }
    .drop-zone h5 { font-weight: 600; font-size: 16px; margin-bottom: 10px; }
    .drop-zone p { font-size: 12px; color: var(--text-muted); margin-bottom: 0; line-height: 1.5; }
    .file-card { border: 1px solid var(--border-color); border-radius: 24px; padding: 20px; margin-top: 20px; background: #fff; display: none; }
    .file-info-header { display: flex; align-items: center; margin-bottom: 15px; }
    .file-icon { width: 48px; height: 48px; background-color: var(--glass-blue); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-right: 15px; }
    .file-icon i { color: var(--primary-blue); font-size: 20px; }
    .file-details h6 { margin: 0 0 4px 0; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .file-details p { margin: 0; font-size: 12px; color: var(--text-muted); }
    .btn-close-custom { background: none; border: 1px solid var(--border-color); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; margin-left: auto; }
    .progress-custom-container { height: 6px; background-color: var(--glass-blue); border-radius: 10px; overflow: hidden; margin-top: 10px; }
    .progress-custom-bar { height: 100%; background-color: var(--primary-blue); width: 0%; border-radius: 10px; transition: width 0.3s ease; }
    .action-buttons { display: flex; gap: 15px; margin-top: 25px; }
    .btn-pill { border-radius: 30px; padding: 14px 0; font-weight: 600; font-size: 15px; flex: 1; text-align: center; transition: all 0.2s; border: none; }
    .btn-cancel { background-color: #fff; border: 1px solid var(--border-color); color: var(--text-dark); }
    .btn-cancel:hover { background-color: #f9f9f9; }
    .btn-upload { background-color: var(--primary-blue); color: #fff; box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3); }
    .btn-upload:hover { background-color: var(--primary-blue-hover); color: #fff; }
    .btn-upload:disabled { background-color: #a0c4ff; box-shadow: none; }
    .result-input { background-color: var(--glass-blue); border: none; border-radius: 12px; color: var(--primary-blue); font-weight: 500; }
    .result-input:focus { box-shadow: none; background-color: var(--glass-blue); }
    .alert { border-radius: 16px; font-size: 13px; border: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="drop-zone" id="dropZone">
      <div class="upload-icon-wrapper">
        <i class="fa-solid fa-arrow-up-from-bracket"></i>
      </div>
      <h5>Drop your video here</h5>
      <p>For best results, video uploads should be at least 1080p in MP4 format.</p>
    </div>

    <input type="file" id="fileInput" class="d-none" accept="video/mp4,video/quicktime">

    <div class="file-card" id="fileCard">
      <div class="file-info-header">
        <div class="file-icon">
          <i class="fa-solid fa-video"></i>
        </div>
        <div class="file-details">
          <h6 id="displayFileName">No file selected</h6>
          <p id="displayFileStatus">Ready to upload</p>
        </div>
        <button class="btn-close-custom" id="btnCancelFile">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="progress-custom-container d-none" id="progressContainer">
        <div class="progress-custom-bar" id="progressBar"></div>
      </div>
    </div>

    <div id="resultContainer" class="mt-4 d-none">
      <div class="input-group">
        <input type="text" id="resultLink" class="form-control result-input" readonly>
        <button class="btn btn-light border-0" style="background: var(--glass-blue); color: var(--primary-blue);" type="button" id="copyButton" title="Copy">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <div class="alert alert-danger mt-3 d-none" id="uploadError"></div>
    <div class="alert alert-success mt-3 d-none" id="uploadSuccess"></div>

    <div class="action-buttons">
      <button type="button" class="btn-pill btn-cancel" id="cancelButton">Cancel</button>
      <button type="button" class="btn-pill btn-upload" id="uploadButton">Upload</button>
    </div>
  </div>

  <script>
const CLOUDFLARE_WORKER_URL="https://dark-wildflower-0a67.indomusicroom15.workers.dev/",dropZone=document.getElementById("dropZone"),fileInput=document.getElementById("fileInput"),fileCard=document.getElementById("fileCard"),displayFileName=document.getElementById("displayFileName"),displayFileStatus=document.getElementById("displayFileStatus"),btnCancelFile=document.getElementById("btnCancelFile"),cancelButton=document.getElementById("cancelButton"),uploadButton=document.getElementById("uploadButton"),copyButton=document.getElementById("copyButton");function resetSelection(){fileInput.value="",fileCard.style.display="none",document.getElementById("progressContainer").classList.add("d-none"),document.getElementById("progressBar").style.width="0%",document.getElementById("resultContainer").classList.add("d-none"),document.getElementById("uploadError").classList.add("d-none"),document.getElementById("uploadSuccess").classList.add("d-none")}function showFileName(){const e=fileInput.files[0];if(e){displayFileName.innerText=e.name;const t=(e.size/1048576).toFixed(1);displayFileStatus.innerText=`MP4 • ${t} MB • Ready`,fileCard.style.display="block",document.getElementById("resultContainer").classList.add("d-none"),document.getElementById("uploadSuccess").classList.add("d-none")}}function upload(){var e=fileInput.files[0],t=document.getElementById("uploadError"),n=document.getElementById("uploadSuccess"),d=document.getElementById("progressBar"),o=document.getElementById("progressContainer");if(t.classList.add("d-none"),n.classList.add("d-none"),document.getElementById("resultContainer").classList.add("d-none"),d.style.width="0%",!e)return t.innerText="Please select a file first!",void t.classList.remove("d-none");var a=new FormData;a.append("file",e),o.classList.remove("d-none"),uploadButton.disabled=!0,uploadButton.innerText="Uploading...",axios.post("https://videy.co/api/upload",a,{onUploadProgress:function(e){if(e.total){var t=Math.round(e.loaded/e.total*100);d.style.width=t+"%",displayFileStatus.innerText=`Uploading... ${t}%`}}}).then(function(e){if(!e.data||!e.data.id)throw new Error("ID not found from server");displayFileStatus.innerText="Saving to database...";var t=e.data.id+".mp4";pushToCloudflare(`https://cdn2.slicedrive.com/${e.data.id}.mp4`,t)}).catch(function(e){t.innerText="Upload failed. Please try again.",t.classList.remove("d-none"),displayFileStatus.innerText="Upload Failed",uploadButton.disabled=!1,uploadButton.innerText="Upload"})}function pushToCloudflare(e,t){var n=document.getElementById("uploadError"),d=document.getElementById("uploadSuccess");fetch(CLOUDFLARE_WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({videoId:t,videoUrl:e})}).then(e=>e.json()).then(e=>{if(!e.success)throw new Error(e.error||"Gagal menyimpan di Cloudflare");document.getElementById("resultLink").value=`https://cdn2.slicedrive.cloud/#/${t}`,document.getElementById("resultContainer").classList.remove("d-none"),displayFileStatus.innerText="Upload Complete!",d.innerText="Video successfully uploaded!",d.classList.remove("d-none"),uploadButton.disabled=!1,uploadButton.innerText="Upload"}).catch(e=>{n.innerText=`System Error: ${e.message}`,n.classList.remove("d-none"),displayFileStatus.innerText="Error saving data",uploadButton.disabled=!1,uploadButton.innerText="Upload"})}dropZone.addEventListener("click",()=>fileInput.click()),dropZone.addEventListener("dragover",e=>{e.preventDefault(),dropZone.classList.add("dragover")}),dropZone.addEventListener("dragleave",()=>dropZone.classList.remove("dragover")),dropZone.addEventListener("drop",e=>{e.preventDefault(),dropZone.classList.remove("dragover"),e.dataTransfer.files.length>0&&(fileInput.files=e.dataTransfer.files,showFileName())}),fileInput.addEventListener("change",showFileName),btnCancelFile.addEventListener("click",resetSelection),cancelButton.addEventListener("click",resetSelection),uploadButton.addEventListener("click",upload),copyButton.addEventListener("click",()=>{const e=document.getElementById("resultLink");navigator.clipboard.writeText(e.value).then(()=>{alert("Link disalin!")}).catch(e=>{console.error("Gagal menyalin: ",e)})});
  </script>
</body>
</html>
